<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RC Car Live Two-Way Audio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #ffffff;
      text-align: center;
      padding: 40px 20px;
    }
    button {
      font-size: 16px;
      padding: 12px 22px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #listenBtn {
      background: #1e88e5;
      color: #fff;
    }
    #talkBtn {
      background: #43a047;
      color: #fff;
    }
    .control-box {
      margin: 16px auto;
      max-width: 360px;
      background: #1e1e1e;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #333;
    }
    .control-box label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #bbdefb;
    }
    select, input[type="range"] {
      width: 100%;
      margin-top: 4px;
      cursor: pointer;
    }
    select {
      padding: 10px 12px;
      font-size: 15px;
      border-radius: 6px;
      border: none;
      background: #2c2c2c;
      color: #fff;
    }
    #status {
      margin-top: 20px;
      color: #90caf9;
    }
    .note {
      margin-top: 12px;
      font-size: 13px;
      color: #aaa;
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <h2>RC Car Live Audio Console</h2>
  <p>লাইভ কথা বলা ও গাড়ির অডিও শোনার কন্ট্রোল প্যানেল</p>

  <button id="listenBtn">Listen (শুনুন)</button>
  <button id="talkBtn">Talk (কথা বলুন)</button>

  <div class="control-box">
    <label for="voiceSelect">ভয়েস মোড বেছে নিন:</label>
    <select id="voiceSelect">
      <option value="normal" selected>Normal (স্বাভাবিক)</option>
      <option value="deep">Deep / গম্ভীর কণ্ঠ</option>
      <option value="high">High / চিকন কণ্ঠ</option>
      <option value="robot">Robot / রোবট ভয়েস</option>
      <option value="walkie">Walkie-Talkie / ওয়াকিটকি</option>
    </select>
  </div>

  <div class="control-box">
    <label for="txGainRange">স্পিকার ভলিউম বুস্ট (পাঠানো ভয়েস): <span id="txGainVal">3.2x</span></label>
    <input id="txGainRange" type="range" min="1.0" max="6.0" step="0.2" value="3.2" />
  </div>

  <div id="status">স্ট্যাটাস: সংযোগ হচ্ছে...</div>
  <div class="note">
    সুরক্ষা ও দ্রুত সাউন্ডের জন্য: ০.০৮ সেকেন্ডের বেশি পুরোনো অডিও বাফার স্বয়ংক্রিয়ভাবে বাদ দেওয়া হবে। কথা বলার সময় একসাথে Listen চালু না রাখলে রিপিট হবে না।
  </div>

  <script>
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${protocol}//${location.host}`);
    ws.binaryType = "arraybuffer";

    const statusEl = document.getElementById("status");
    const listenBtn = document.getElementById("listenBtn");
    const talkBtn = document.getElementById("talkBtn");
    const voiceSelect = document.getElementById("voiceSelect");
    const txGainRange = document.getElementById("txGainRange");
    const txGainVal = document.getElementById("txGainVal");

    let audioCtx = null;
    let rxGainNode = null;
    let nextPlayTime = 0;
    let isTalking = false;
    let isListening = false;
    let micStream = null;
    let processor = null;
    let micSource = null;
    let muteMonitorGain = null;

    let resampleCarry = new Float32Array(0);
    let resamplePos = 0;
    let robotPhase = 0;
    let lpState = 0;
    let hpState = 0;
    let prevSample = 0;
    let gateEnvelope = 0;

    txGainRange.oninput = () => {
      txGainVal.textContent = `${parseFloat(txGainRange.value).toFixed(1)}x`;
    };

    ws.onopen = () => {
      statusEl.textContent = "স্ট্যাটাস: সার্ভারের সাথে যুক্ত হয়েছে";
    };

    ws.onclose = () => {
      statusEl.textContent = "স্ট্যাটাস: সার্ভার সংযোগ বিচ্ছিন্ন";
    };

    function ensureAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({
          sampleRate: 16000
        });
        rxGainNode = audioCtx.createGain();
        rxGainNode.gain.value = 2.0;
        rxGainNode.connect(audioCtx.destination);
        nextPlayTime = audioCtx.currentTime;
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    // আসা অডিও লাইভ বাজানো (পুরোনো বাফার জমে গেলে সঙ্গে সঙ্গে ড্রপ করে সিঙ্ক রাখা)
    ws.onmessage = async (event) => {
      if (!isListening || !audioCtx || audioCtx.state !== "running") return;

      const arrayBuffer = event.data instanceof Blob
        ? await event.data.arrayBuffer()
        : event.data;

      if (!(arrayBuffer instanceof ArrayBuffer) || arrayBuffer.byteLength < 2) return;

      const pcm16 = new Int16Array(arrayBuffer);
      const float32 = new Float32Array(pcm16.length);
      for (let i = 0; i < pcm16.length; i++) {
        float32[i] = pcm16[i] / 32768;
      }

      const audioBuffer = audioCtx.createBuffer(1, float32.length, 16000);
      audioBuffer.copyToChannel(float32, 0);

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(rxGainNode);

      const now = audioCtx.currentTime;
      // ল্যাগ 80ms এর বেশি হলে পুরোনো জমে থাকা ডাটা স্কিপ করে লাইভ প্লেব্যাক শুরু
      if (nextPlayTime < now || (nextPlayTime - now) > 0.08) {
        nextPlayTime = now + 0.015;
      }
      source.start(nextPlayTime);
      nextPlayTime += audioBuffer.duration;
    };

    listenBtn.onclick = () => {
      ensureAudioContext();
      isListening = true;
      nextPlayTime = audioCtx.currentTime + 0.015;
      statusEl.textContent = "স্ট্যাটাস: লাইভ Listen চালু আছে";
    };

    function applyPitchShift(samples, ratio) {
      if (Math.abs(ratio - 1.0) < 0.001) {
        return samples;
      }

      const combined = new Float32Array(resampleCarry.length + samples.length);
      combined.set(resampleCarry, 0);
      combined.set(samples, resampleCarry.length);

      const out = [];
      let pos = resamplePos;

      while (pos + 1 < combined.length) {
        const idx = Math.floor(pos);
        const frac = pos - idx;
        const val = combined[idx] * (1 - frac) + combined[idx + 1] * frac;
        out.push(val);
        pos += ratio;
      }

      const consumed = Math.floor(pos);
      if (consumed < combined.length) {
        resampleCarry = combined.slice(consumed);
        resamplePos = pos - consumed;
      } else {
        resampleCarry = new Float32Array(0);
        resamplePos = 0;
      }

      return new Float32Array(out);
    }

    // নয়েজ গেট + ভয়েস ইফেক্ট + ভলিউম বুস্ট + ক্লিপ সুরক্ষা
    function processOutgoingAudio(inputSamples, mode, gainBoost) {
      let samples = inputSamples;

      if (mode === "deep") {
        const shifted = applyPitchShift(samples, 0.78);
        const out = new Float32Array(shifted.length);
        for (let i = 0; i < shifted.length; i++) {
          lpState = lpState + 0.35 * (shifted[i] - lpState);
          out[i] = lpState * 1.15;
        }
        samples = out;
      } else if (mode === "high") {
        const shifted = applyPitchShift(samples, 1.32);
        const out = new Float32Array(shifted.length);
        for (let i = 0; i < shifted.length; i++) {
          out[i] = shifted[i] * 1.08;
        }
        samples = out;
      } else if (mode === "robot") {
        const out = new Float32Array(samples.length);
        const carrierFreq = 95;
        const step = (2 * Math.PI * carrierFreq) / 16000;
        for (let i = 0; i < samples.length; i++) {
          const mod = Math.sin(robotPhase);
          robotPhase += step;
          if (robotPhase > 2 * Math.PI) robotPhase -= 2 * Math.PI;
          out[i] = samples[i] * (0.45 + 0.55 * mod) * 1.2;
        }
        samples = out;
      } else if (mode === "walkie") {
        const out = new Float32Array(samples.length);
        for (let i = 0; i < samples.length; i++) {
          const x = samples[i];
          const hp = 0.85 * (hpState + x - prevSample);
          hpState = hp;
          prevSample = x;
          lpState = lpState + 0.28 * (hp - lpState);
          const clipped = Math.max(-0.55, Math.min(0.55, lpState * 1.8));
          out[i] = clipped * 1.35;
        }
        samples = out;
      }

      // হালকা নয়েজ গেট (চুপ থাকলে ব্যাকগ্রাউন্ড হিস/নয়েজ ব্লক রাখা) ও ভলিউম বুস্ট
      const finalOut = new Float32Array(samples.length);
      const noiseThreshold = 0.018;

      for (let i = 0; i < samples.length; i++) {
        const raw = samples[i];
        const absVal = Math.abs(raw);
        const targetGate = absVal > noiseThreshold ? 1.0 : 0.05;
        gateEnvelope += (targetGate - gateEnvelope) * 0.08;

        // সফট-ক্লিপ সুরক্ষা (বিকৃত শব্দ বা ব্লক ঠেকাতে)
        let boosted = raw * gateEnvelope * gainBoost;
        boosted = Math.tanh(boosted);
        finalOut[i] = boosted;
      }

      return finalOut;
    }

    async function startTalking() {
      if (isTalking) return;
      ensureAudioContext();

      // কথা বলার সময় রিপিট/লুপ ঠেকাতে Listen অটো পজ করা
      isListening = false;

      resampleCarry = new Float32Array(0);
      resamplePos = 0;
      robotPhase = 0;
      lpState = 0;
      hpState = 0;
      prevSample = 0;
      gateEnvelope = 0;

      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            sampleRate: 16000,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        micSource = audioCtx.createMediaStreamSource(micStream);
        // কম লেটেন্সির জন্য 1024 বাফার
        processor = audioCtx.createScriptProcessor(1024, 1, 1);

        // নিজের ডিভাইসে মাইক্রোফোনের শব্দ লুপ হওয়া বন্ধ রাখতে 0 gain দিয়ে কানেক্ট
        muteMonitorGain = audioCtx.createGain();
        muteMonitorGain.gain.value = 0;

        processor.onaudioprocess = (e) => {
          if (!isTalking || ws.readyState !== WebSocket.OPEN) return;
          const input = e.inputBuffer.getChannelData(0);
          const boost = parseFloat(txGainRange.value) || 3.2;
          const processed = processOutgoingAudio(input, voiceSelect.value, boost);

          const pcm16 = new Int16Array(processed.length);
          for (let i = 0; i < processed.length; i++) {
            const s = Math.max(-1, Math.min(1, processed[i]));
            pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
          }
          ws.send(pcm16.buffer);
        };

        micSource.connect(processor);
        processor.connect(muteMonitorGain);
        muteMonitorGain.connect(audioCtx.destination);

        isTalking = true;
        talkBtn.textContent = "Stop Talking (বন্ধ করুন)";
        statusEl.textContent = `স্ট্যাটাস: লাইভ Talk চালু (${voiceSelect.options[voiceSelect.selectedIndex].text})`;
      } catch (err) {
        statusEl.textContent = "মাইক্রোফোন অনুমতি পাওয়া যায়নি: " + err.message;
      }
    }

    function stopTalking() {
      isTalking = false;
      if (processor) {
        processor.disconnect();
        processor = null;
      }
      if (muteMonitorGain) {
        muteMonitorGain.disconnect();
        muteMonitorGain = null;
      }
      if (micSource) {
        micSource.disconnect();
        micSource = null;
      }
      if (micStream) {
        micStream.getTracks().forEach((t) => t.stop());
        micStream = null;
      }
      talkBtn.textContent = "Talk (কথা বলুন)";
      statusEl.textContent = "স্ট্যাটাস: Talk বন্ধ হয়েছে (শুনতে Listen চাপুন)";
    }

    voiceSelect.onchange = () => {
      if (isTalking) {
        statusEl.textContent = `স্ট্যাটাস: লাইভ Talk চালু (${voiceSelect.options[voiceSelect.selectedIndex].text})`;
      }
    };

    talkBtn.onclick = () => {
      if (!isTalking) startTalking();
      else stopTalking();
    };
  </script>
</body>
</html>
