<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RC Car Live Two-Way Audio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #ffffff;
      text-align: center;
      padding: 40px 20px;
    }
    button {
      font-size: 16px;
      padding: 12px 22px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #listenBtn {
      background: #1e88e5;
      color: #fff;
    }
    #talkBtn {
      background: #43a047;
      color: #fff;
    }
    .control-box {
      margin: 16px auto;
      max-width: 360px;
      background: #1e1e1e;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #333;
    }
    .control-box label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #bbdefb;
    }
    select, input[type="range"] {
      width: 100%;
      margin-top: 4px;
      cursor: pointer;
    }
    select {
      padding: 10px 12px;
      font-size: 15px;
      border-radius: 6px;
      border: none;
      background: #2c2c2c;
      color: #fff;
    }
    #status {
      margin-top: 20px;
      color: #90caf9;
    }
  </style>
</head>
<body>
  <h2>RC Car Live Audio Console</h2>
  <p>লাইভ কথা বলা ও গাড়ির অডিও শোনার কন্ট্রোল প্যানেল</p>

  <button id="listenBtn">Listen (শুনুন)</button>
  <button id="talkBtn">Talk (কথা বলুন)</button>

  <div class="control-box">
    <label for="voiceSelect">ভয়েস মোড বেছে নিন:</label>
    <select id="voiceSelect">
      <option value="normal" selected>Normal (স্বাভাবিক)</option>
      <option value="cartoon">Cartoon (কার্টুন ভয়েস)</option>
      <option value="kid">Kid (বাচ্চাদের ভয়েস)</option>
      <option value="robot">Robot (রোবোটিক ভয়েস)</option>
      <option value="deep">Deep (গম্ভীর কণ্ঠ)</option>
    </select>
  </div>

  <div class="control-box">
    <label for="txGainRange">স্পিকার ভলিউম বুস্ট (পাঠানো ভয়েস): <span id="txGainVal">1.8x</span></label>
    <input id="txGainRange" type="range" min="1.0" max="2.5" step="0.1" value="1.8" />
  </div>

  <div id="status">স্ট্যাটাস: সংযোগ হচ্ছে...</div>

  <script>
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    let ws = null;

    const statusEl = document.getElementById("status");
    const listenBtn = document.getElementById("listenBtn");
    const talkBtn = document.getElementById("talkBtn");
    const voiceSelect = document.getElementById("voiceSelect");
    const txGainRange = document.getElementById("txGainRange");
    const txGainVal = document.getElementById("txGainVal");

    let audioCtx = null;
    let rxGainNode = null;
    let nextPlayTime = 0;
    let isTalking = false;
    let isListening = false;
    let micStream = null;
    let processor = null;
    let micSource = null;
    let muteMonitorGain = null;

    let txResamplePos = 0.0;
    let robotPhase = 0.0;
    let lpState = 0.0;
    let hpState = 0.0;
    let prevSample = 0.0;
    let prevHpSample = 0.0;
    let gateGain = 0.0;

    function connectWS() {
      ws = new WebSocket(`${protocol}//${location.host}`);
      ws.binaryType = "arraybuffer";

      ws.onopen = () => {
        statusEl.textContent = "স্ট্যাটাস: সার্ভারের সাথে যুক্ত হয়েছে";
      };

      ws.onclose = () => {
        statusEl.textContent = "স্ট্যাটাস: সংযোগ বিচ্ছিন্ন, আবার যুক্ত হচ্ছে...";
        setTimeout(connectWS, 2000);
      };

      ws.onmessage = async (event) => {
        if (!isListening || !audioCtx || audioCtx.state !== "running") return;
        const arrayBuffer = event.data instanceof Blob ? await event.data.arrayBuffer() : event.data;
        if (!(arrayBuffer instanceof ArrayBuffer) || arrayBuffer.byteLength < 2) return;

        const pcm16 = new Int16Array(arrayBuffer);
        const float32 = new Float32Array(pcm16.length);
        for (let i = 0; i < pcm16.length; i++) {
          float32[i] = pcm16[i] / 32768;
        }

        const audioBuffer = audioCtx.createBuffer(1, float32.length, 16000);
        audioBuffer.copyToChannel(float32, 0);

        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(rxGainNode);

        const now = audioCtx.currentTime;
        if (nextPlayTime < now || (nextPlayTime - now) > 0.08) {
          nextPlayTime = now + 0.015;
        }
        source.start(nextPlayTime);
        nextPlayTime += audioBuffer.duration;
      };
    }

    connectWS();

    txGainRange.oninput = () => {
      txGainVal.textContent = `${parseFloat(txGainRange.value).toFixed(1)}x`;
    };

    async function ensureAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        rxGainNode = audioCtx.createGain();
        rxGainNode.gain.value = 1.9;
        rxGainNode.connect(audioCtx.destination);
        nextPlayTime = audioCtx.currentTime;
      }
      if (audioCtx.state === "suspended") {
        await audioCtx.resume();
      }
    }

    function resetDspState() {
      txResamplePos = 0.0;
      robotPhase = 0.0;
      lpState = 0.0;
      hpState = 0.0;
      prevSample = 0.0;
      prevHpSample = 0.0;
      gateGain = 0.0;
    }

    function resampleTo16k(samples, inputRate) {
      if (!samples || samples.length === 0) return new Float32Array(0);
      if (Math.abs(inputRate - 16000) < 1) return samples;

      const ratio = inputRate / 16000;
      const outLen = Math.floor(samples.length / ratio);
      const out = new Float32Array(outLen);

      let pos = txResamplePos;
      for (let i = 0; i < outLen; i++) {
        const idx = Math.min(samples.length - 2, Math.max(0, Math.floor(pos)));
        const frac = pos - idx;
        out[i] = samples[idx] * (1.0 - frac) + samples[idx + 1] * frac;
        pos += ratio;
      }
      txResamplePos = pos - outLen * ratio;
      if (txResamplePos < 0 || txResamplePos >= ratio) txResamplePos = 0;
      return out;
    }

    listenBtn.onclick = async () => {
      await ensureAudioContext();
      isListening = true;
      nextPlayTime = audioCtx.currentTime + 0.015;
      statusEl.textContent = "স্ট্যাটাস: লাইভ Listen চালু আছে";
    };

    // ভিড়ের মাঝে ভয়েস স্পষ্ট রাখতে প্রেজেন্স বুস্ট + ঘেরঘেরমুক্ত নয়েজ গেট
    function processOutgoingAudio(inputSamples, mode, gainBoost) {
      const out = new Float32Array(inputSamples.length);
      const openThreshold = 0.035;
      const closeThreshold = 0.017;
      const robotStep = (2.0 * Math.PI * 130) / 16000;

      for (let i = 0; i < inputSamples.length; i++) {
        const x = inputSamples[i];

        // ১. হাই-পাস ফিল্টার (নিচু ফ্রিকোয়েন্সির গুঞ্জন ও ঘেরঘের কমাতে)
        const hp = 0.978 * (hpState + x - prevSample);
        hpState = hp;
        prevSample = x;

        // ২. নয়েজ গেট
        const amp = Math.abs(hp);
        let desiredGate = gateGain;
        if (amp > openThreshold) desiredGate = 1.0;
        else if (amp < closeThreshold) desiredGate = 0.0;

        const coeff = desiredGate > gateGain ? 0.32 : 0.18;
        gateGain += (desiredGate - gateGain) * coeff;

        let s = hp * gateGain;

        // ৩. ভিড়ের মাঝে কথা স্পষ্ট করার জন্য ভয়েস প্রেজেন্স (হালকা শার্পনেস)
        const diff = s - prevHpSample;
        prevHpSample = s;
        s = s + 0.35 * diff;

        // ৪. ভয়েস মোডগুলো
        if (mode === "cartoon") {
          s = (s + 0.45 * diff) * 1.15;
        } else if (mode === "kid") {
          s = (s + 0.25 * diff) * 1.10;
        } else if (mode === "robot") {
          const mod = Math.sin(robotPhase);
          robotPhase += robotStep;
          if (robotPhase > 2.0 * Math.PI) robotPhase -= 2.0 * Math.PI;
          s = s * (0.82 + 0.18 * mod) * 1.12;
        } else if (mode === "deep") {
          lpState = lpState + 0.50 * (s - lpState);
          s = (lpState + 0.20 * diff) * 1.15;
        }

        // ৫. সফট লিমিটিং দিয়ে জোরালো ও ঘেরঘেরমুক্ত আউটপুট
        out[i] = Math.tanh(s * gainBoost * 1.25) * 0.90;
      }

      return out;
    }

    async function startTalking() {
      if (isTalking) return;
      await ensureAudioContext();

      if (!ws || ws.readyState !== WebSocket.OPEN) {
        statusEl.textContent = "স্ট্যাটাস: WebSocket যুক্ত নয়, একটু অপেক্ষা করুন";
        return;
      }

      resetDspState();

      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        micSource = audioCtx.createMediaStreamSource(micStream);
        processor = audioCtx.createScriptProcessor(4096, 1, 1);

        muteMonitorGain = audioCtx.createGain();
        muteMonitorGain.gain.value = 0;

        processor.onaudioprocess = (e) => {
          if (!isTalking || !ws || ws.readyState !== WebSocket.OPEN) return;
          const rawInput = e.inputBuffer.getChannelData(0);
          const input16k = resampleTo16k(rawInput, audioCtx.sampleRate);
          const boost = parseFloat(txGainRange.value) || 1.8;
          const processed = processOutgoingAudio(input16k, voiceSelect.value, boost);

          const pcm16 = new Int16Array(processed.length);
          for (let i = 0; i < processed.length; i++) {
            const s = Math.max(-1, Math.min(1, processed[i]));
            pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
          }

          if (pcm16.byteLength > 0) {
            ws.send(pcm16.buffer);
          }
        };

        micSource.connect(processor);
        processor.connect(muteMonitorGain);
        muteMonitorGain.connect(audioCtx.destination);

        isTalking = true;
        talkBtn.textContent = "Stop Talking (বন্ধ করুন)";
        statusEl.textContent = `স্ট্যাটাস: লাইভ Talk চালু (${voiceSelect.options[voiceSelect.selectedIndex].text})`;
      } catch (err) {
        statusEl.textContent = "মাইক্রোফোন অনুমতি পাওয়া যায়নি: " + err.message;
      }
    }

    function stopTalking() {
      isTalking = false;
      if (processor) { processor.disconnect(); processor = null; }
      if (muteMonitorGain) { muteMonitorGain.disconnect(); muteMonitorGain = null; }
      if (micSource) { micSource.disconnect(); micSource = null; }
      if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
      resetDspState();
      talkBtn.textContent = "Talk (কথা বলুন)";
      statusEl.textContent = "স্ট্যাটাস: Talk বন্ধ হয়েছে";
    }

    voiceSelect.onchange = () => {
      if (isTalking) {
        statusEl.textContent = `স্ট্যাটাস: লাইভ Talk চালু (${voiceSelect.options[voiceSelect.selectedIndex].text})`;
      }
    };

    talkBtn.onclick = () => {
      if (!isTalking) startTalking();
      else stopTalking();
    };
  </script>
</body>
</html>
